# XcodeGen spec: run `xcodegen generate` to create KPDF.xcodeproj.
# The Xcode build is sandboxed (see Support/KPDF.entitlements);
# the SwiftPM build in scripts/build-app.sh is not.
name: KPDF
options:
  bundleIdPrefix: com.kpdf
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PDFEditorCore:
    type: framework
    platform: macOS
    sources:
      - Sources/PDFEditorCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kpdf.core
  KPDF:
    type: application
    platform: macOS
    sources:
      - Sources/PDFEditor
      - Support/Assets.xcassets
    dependencies:
      - target: PDFEditorCore
    settings:
      base:
        PRODUCT_NAME: KPDF
        PRODUCT_BUNDLE_IDENTIFIER: com.kpdf.app
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/KPDF.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
  PDFEditorCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PDFEditorCoreTests
    dependencies:
      - target: PDFEditorCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KPDF:
    build:
      targets:
        KPDF: all
    test:
      targets:
        - PDFEditorCoreTests
