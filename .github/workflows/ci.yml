name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh release
          cd build && ditto -c -k --keepParent "PDF Editor.app" PDFEditor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-app
          path: build/PDFEditor.zip
