name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      - name: Build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Test failures
        if: failure()
        run: grep -E "error:|failed|Fatal" test.log | sort -u | head -150

      - name: Build app bundle
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh release
          cd build && ditto -c -k --keepParent "PDF Editor.app" PDFEditor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-app
          path: build/PDFEditor.zip
