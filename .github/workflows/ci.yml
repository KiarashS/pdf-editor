name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log

      - name: Build errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Test failures
        if: failure()
        run: grep -E "error:|failed|Fatal" test.log | sort -u | head -150

      - name: Build app and disk image
        run: |
          scripts/build-app.sh release
          scripts/make-dmg.sh "build/PDF-Editor-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Editor-${{ env.VERSION }}
          path: build/PDF-Editor-${{ env.VERSION }}.dmg

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          PREVIOUS="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "Build $BUILD_NUMBER from \`${GITHUB_SHA::7}\`."
            echo
            echo "## Changes"
            if [ -n "$PREVIOUS" ]; then
              git log --pretty='- %s (%h)' "$PREVIOUS..HEAD"
            else
              git log --pretty='- %s (%h)'
            fi
            echo
            echo "## Installing"
            echo "Open the .dmg and drag PDF Editor to Applications. The app is ad-hoc signed, not notarized:"
            echo "the first time, right-click it and choose Open, or run \`xattr -dr com.apple.quarantine \"/Applications/PDF Editor.app\"\`."
            echo "Requires macOS 14 or later."
          } > release-notes.md
          gh release create "$TAG" "build/PDF-Editor-$VERSION.dmg" \
            --target "$GITHUB_SHA" \
            --title "PDF Editor $VERSION" \
            --notes-file release-notes.md
